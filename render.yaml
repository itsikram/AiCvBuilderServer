# Render blueprint for the API. The frontend is a separate repo (aicvbuilderbd-client) deployed as static
# files on cPanel (https://aicvbuilderbd.online), so the refresh-token cookie is
# cross-site and needs COOKIE_SAME_SITE=none.
services:
  - type: web
    name: aicvbuilderbd-server
    runtime: node
    buildCommand: npm ci && npm run build
    # Applies pending Prisma migrations before each start; a no-op when the schema is current
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://aicvbuilderbd.online
      - key: COOKIE_SAME_SITE
        value: none
      # mysql://USER:PASSWORD@HOST:3306/DATABASE; the MySQL server must accept connections from Render
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: DISABLE_REDIS
        value: true
