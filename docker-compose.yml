version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: aicvbuilderbd-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme

  redis:
    image: redis:7-alpine
    container_name: aicvbuilderbd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicvbuilderbd-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  mongo_data:
  redis_data:
