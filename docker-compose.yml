version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: aicvbuilderbd-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: aicvbuilderbd
      MYSQL_ROOT_PASSWORD: changeme
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:7-alpine
    container_name: aicvbuilderbd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicvbuilderbd-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: mysql://root:changeme@mysql:3306/aicvbuilderbd
    depends_on:
      - mysql
      - redis
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  mysql_data:
  redis_data:
